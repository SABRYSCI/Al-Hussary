<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <!-- سطر حيوي لجعل الواجهة متوافقة تماماً مع شاشات الهواتف -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أكاديمية الحصري لقراء الجيل الذهبي</title>
  <style>
    :root {
      --primary-color: #0d4d47;
      --hover-color: #116b63;
      --bg-color: #f4f7f6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 10px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 22px;
    }
    
    /* تصميم التبويبات المتجاوب مع الهاتف */
    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      cursor: pointer;
      background: #e0e0e0;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      font-weight: bold;
      transition: 0.3s;
      text-align: center;
    }
    .tab-btn.active { background: var(--primary-color); color: white; }
    
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.4s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* النماذج مكبرة لتناسب لمس الأصابع */
    .form-group { margin-bottom: 15px; }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: var(--primary-color);
      font-size: 14px;
    }
    select, input, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px; /* خط 16px يمنع هواتف الآيفون من عمل Zoom */
      box-sizing: border-box;
    }
    button.action-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 10px;
    }
    button.action-btn:disabled { background-color: #7f8c8d; }

    /* الجداول متجاوبة مع السحب */
    .table-responsive {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: right; font-size: 14px; }
    th { background-color: var(--primary-color); color: white; white-space: nowrap; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .update-box {
      background-color: #e8f5e9;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #c8e6c9;
      text-align: center;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>أكاديمية الحصري لقراء الجيل الذهبي</h1>
    
    <div class="tabs">
      <button id="tabSearch" class="tab-btn active" onclick="switchTab('search')">البحث</button>
      <button id="tabFollowup" class="tab-btn" onclick="switchTab('followup')">المتابعة</button>
    </div>

    <!-- قسم البحث -->
    <div id="searchSection" class="section active">
      <div class="form-group">
        <label>نوع البحث:</label>
        <select id="searchType" onchange="toggleSearchInputs()">
          <option value="teacher">بحث باسم المعلمة</option>
          <option value="day">بحث باليوم</option>
        </select>
      </div>
      
      <div id="teacherInput" class="form-group">
        <label>اسم المعلمة:</label>
        <select id="searchTeacherName" class="teacherDropdown">
          <option value="">جاري التحميل...</option>
        </select>
      </div>

      <div id="dayInput" class="form-group" style="display: none;">
        <label>اليوم:</label>
        <select id="searchDay">
          <option value="السبت">السبت</option>
          <option value="الأحد">الأحد</option>
          <option value="الإثنين">الإثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
        </select>
      </div>

      <button class="action-btn" onclick="executeSearch()" id="searchBtn">🔍 بحث</button>
      <div id="searchMessage" style="text-align:center; margin-top:10px; font-weight:bold;"></div>

      <div class="table-responsive">
        <table id="resultsTable" style="display:none;">
          <thead>
            <tr><th>المعلمة</th><th>الطالبة</th><th>اليوم</th><th>الوقت</th></tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>

    <!-- قسم المتابعة -->
    <div id="followupSection" class="section">
      
      <div class="update-box">
        <h3 style="margin-top: 0; font-size: 16px; color: var(--primary-color);">تحديث بيانات النظام</h3>
        <button id="updateDbBtn" class="action-btn" onclick="triggerUpdate()">
          <span id="btnText">🔄 مزامنة الجداول</span>
        </button>
        <p id="updateStatus" style="margin-top: 10px; font-size: 14px; font-weight:bold;"></p>
      </div>
      
      <div class="form-group">
        <label>المعلمة:</label>
        <select id="logTeacher" class="teacherDropdown"><option value="">جاري التحميل...</option></select>
      </div>
      <div class="form-group">
        <label>اسم الطالبة:</label>
        <input type="text" id="logStudent" placeholder="أدخل اسم الطالبة">
      </div>
      <div class="form-group">
        <label>اليوم:</label>
        <select id="logDay">
          <option value="السبت">السبت</option>
          <option value="الأحد">الأحد</option>
          <option value="الإثنين">الإثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
        </select>
      </div>
      <div class="form-group">
        <label>الوقت (مثال: 04:30 مساءً):</label>
        <input type="text" id="logTime" placeholder="00:00 مساءً">
      </div>
      <div class="form-group">
        <label>الحالة:</label>
        <select id="logStatus">
          <option value="حضور">حضور</option>
          <option value="غياب بعذر">غياب بعذر</option>
          <option value="غياب بدون عذر">غياب بدون عذر</option>
          <option value="تأخير">تأخير</option>
        </select>
      </div>
      <div class="form-group">
        <label>ملاحظات (اختياري):</label>
        <input type="text" id="logNotes" placeholder="أي ملاحظات">
      </div>

      <button class="action-btn" onclick="submitAttendance()" id="saveBtn">💾 حفظ السجل</button>
      <div id="saveMessage" style="text-align:center; margin-top:10px; font-weight:bold;"></div>

    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ ضع رابط تطبيق الويب الخاص بك هنا 
    // ==========================================
    const API_URL = "أدخل_رابط_تطبيق_جوجل_هنا_الذي_ينتهي_بكلمة_exec";

    // دالة الاتصال بالواجهة الخلفية (API)
    async function apiCall(action, data = {}) {
      if(API_URL === "أدخل_رابط_تطبيق_جوجل_هنا_الذي_ينتهي_بكلمة_exec") {
        throw new Error("يرجى إضافة رابط تطبيق جوجل في ملف HTML أولاً.");
      }
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, data: data })
      });
      const result = await response.json();
      if (result.error) throw new Error(result.error);
      return result;
    }

    function switchTab(tab) {
      document.getElementById('searchSection').classList.remove('active');
      document.getElementById('followupSection').classList.remove('active');
      document.getElementById('tabSearch').classList.remove('active');
      document.getElementById('tabFollowup').classList.remove('active');

      if(tab === 'search') {
        document.getElementById('searchSection').classList.add('active');
        document.getElementById('tabSearch').classList.add('active');
      } else {
        document.getElementById('followupSection').classList.add('active');
        document.getElementById('tabFollowup').classList.add('active');
      }
    }

    function toggleSearchInputs() {
      var type = document.getElementById('searchType').value;
      document.getElementById('teacherInput').style.display = (type === 'teacher') ? 'block' : 'none';
      document.getElementById('dayInput').style.display = (type === 'day') ? 'block' : 'none';
    }

    window.onload = loadTeachersData;

    async function loadTeachersData() {
      try {
        const data = await apiCall('getInitData');
        const dropdowns = document.getElementsByClassName('teacherDropdown');
        for (let select of dropdowns) {
          select.innerHTML = '<option value="">-- اختر المعلمة --</option>';
          data.teachers.forEach(teacher => {
            let option = document.createElement('option');
            option.value = teacher; option.text = teacher;
            select.appendChild(option);
          });
        }
      } catch (e) {
        console.error("خطأ في جلب البيانات: ", e);
      }
    }

    async function triggerUpdate() {
      const btn = document.getElementById('updateDbBtn');
      const statusText = document.getElementById('updateStatus');
      
      btn.disabled = true;
      statusText.innerText = '⏳ جاري القراءة من الجداول...';
      statusText.style.color = '#333';

      try {
        const res = await apiCall('updateMasterDB');
        statusText.style.color = '#27ae60'; 
        statusText.innerText = res.message; 
        await loadTeachersData(); // تحديث القوائم
      } catch (err) {
        statusText.style.color = '#c0392b'; 
        statusText.innerText = '❌ خطأ: ' + err.message;
      } finally {
        btn.disabled = false;
        setTimeout(() => statusText.innerText = '', 5000);
      }
    }

    async function executeSearch() {
      const btn = document.getElementById('searchBtn');
      const msg = document.getElementById('searchMessage');
      const type = document.getElementById('searchType').value;
      
      let params = { type: type };
      if (type === 'teacher') params.teacher = document.getElementById('searchTeacherName').value;
      if (type === 'day') params.day = document.getElementById('searchDay').value;

      btn.disabled = true;
      msg.style.color = '#333';
      msg.innerText = '⏳ جاري البحث...';
      document.getElementById('resultsTable').style.display = 'none';

      try {
        const results = await apiCall('searchSchedule', params);
        const tbody = document.getElementById('resultsBody');
        tbody.innerHTML = '';
        
        if (results.length === 0) {
          msg.style.color = '#c0392b';
          msg.innerText = 'لا توجد نتائج مطابقة.';
        } else {
          msg.innerText = 'تم العثور على ' + results.length + ' نتيجة.';
          msg.style.color = '#27ae60';
          results.forEach(row => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${row.teacher}</td><td>${row.student}</td><td>${row.day}</td><td>${row.time}</td>`;
            tbody.appendChild(tr);
          });
          document.getElementById('resultsTable').style.display = 'table';
        }
      } catch (err) {
        msg.style.color = '#c0392b';
        msg.innerText = '❌ خطأ: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function submitAttendance() {
      const btn = document.getElementById('saveBtn');
      const msg = document.getElementById('saveMessage');
      
      const record = {
        teacher: document.getElementById('logTeacher').value,
        student: document.getElementById('logStudent').value,
        day: document.getElementById('logDay').value,
        time: document.getElementById('logTime').value,
        status: document.getElementById('logStatus').value,
        notes: document.getElementById('logNotes').value
      };

      if (!record.teacher || !record.student || !record.time) {
        msg.style.color = '#c0392b';
        msg.innerText = 'يرجى تعبئة الحقول الأساسية.';
        return;
      }

      btn.disabled = true;
      msg.style.color = '#333';
      msg.innerText = '⏳ جاري الحفظ...';

      try {
        const res = await apiCall('saveAttendance', record);
        msg.style.color = '#27ae60';
        msg.innerText = res.message;
        
        document.getElementById('logStudent').value = '';
        document.getElementById('logTime').value = '';
        document.getElementById('logNotes').value = '';
      } catch (err) {
        msg.style.color = '#c0392b';
        msg.innerText = '❌ خطأ: ' + err.message;
      } finally {
        btn.disabled = false;
        setTimeout(() => { if(msg.innerText === 'تم حفظ السجل بنجاح!') msg.innerText = ''; }, 4000);
      }
    }
  </script>
</body>
</html>
