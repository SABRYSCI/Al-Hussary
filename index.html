<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أكاديمية الحصري لقراء الجيل الذهبي</title>
  <style>
    :root {
      --primary-color: #0d4d47;
      --hover-color: #116b63;
      --bg-color: #f0f4f3;
      --green-btn: #198754;
      --yellow-btn: #e5a100;
      --red-btn: #dc3545;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      margin: 0; padding: 12px; color: #333;
    }
    .container {
      max-width: 500px; margin: 0 auto; background: white;
      padding: 18px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      box-sizing: border-box;
    }
    
    /* الشعار والعنوان */
    .header-logo { text-align: center; margin-bottom: 12px; }
    .header-logo img { max-width: 130px; height: auto; border-radius: 12px; }
    h1 { text-align: center; color: var(--primary-color); font-size: 20px; margin: 8px 0 16px 0; }
    
    /* شاشة تسجيل الدخول */
    #loginScreen { max-width: 380px; margin: 40px auto; text-align: center; }
    
    /* التبويبات */
    .tabs { display: flex; justify-content: space-between; margin-bottom: 16px; gap: 6px; }
    .tab-btn { flex: 1; padding: 10px 4px; cursor: pointer; background: #e9ecef; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; transition: 0.2s; text-align: center; color: #495057; }
    .tab-btn.active { background: var(--primary-color); color: white; }
    
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* حقول الإدخال */
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: var(--primary-color); font-size: 13px; }
    select, input { width: 100%; padding: 11px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
    
    button.action-btn { background-color: var(--primary-color); color: white; border: none; font-weight: bold; padding: 12px; border-radius: 8px; width: 100%; font-size: 15px; cursor: pointer; transition: 0.2s; }
    button.action-btn:hover { background-color: var(--hover-color); }
    button.action-btn:disabled { background-color: #adb5bd; cursor: wait; }

    /* صندوق المزامنة */
    .update-box { background-color: #eaf5ea; padding: 10px; border-radius: 10px; border: 1px solid #cce5cc; text-align: center; margin-bottom: 14px; }
    .sync-btn { background-color: #116b63; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; width: 100%; }

    /* زر إعادة الضبط المطابق للصورة */
    .reset-btn {
      width: 100%; background: #e2e8f0; color: #334155; border: 1px solid #cbd5e1;
      padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px;
      margin-bottom: 14px; cursor: pointer;
    }
    .reset-btn:hover { background: #cbd5e1; }

    /* الفلتر السريع */
    #fastFilter { margin: 10px 0 14px 0; border: 2px solid var(--primary-color); border-radius: 8px; }

    /* تصميم البطاقات مطابق تماماً للصورة */
    .schedule-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.15s ease;
    }
    .card-teacher {
      font-size: 17px;
      font-weight: bold;
      color: #0d4d47;
      margin-bottom: 8px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 6px;
    }
    .card-student {
      font-size: 16px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      margin-top: 6px;
    }
    .card-meta {
      font-size: 13px;
      color: #64748b;
      margin: 4px 0 12px 0;
    }
    .attendance-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid #f1f5f9;
      padding-top: 10px;
    }
    .btn-attend {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-attend:active { transform: scale(0.96); }
    .btn-present { background-color: var(--green-btn); }
    .btn-late { background-color: var(--yellow-btn); }
    .btn-absent { background-color: var(--red-btn); }

    .card-status-label {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
      display: none;
    }

    /* الإحصائيات */
    .stats-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .stat-card { background: var(--primary-color); color: white; flex: 1; min-width: 100px; padding: 16px 8px; border-radius: 10px; text-align: center; }
    .stat-card h3 { margin: 0; font-size: 24px; }
    .stat-card p { margin: 4px 0 0 0; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- ================= شاشة تسجيل الدخول ================= -->
  <div id="loginScreen" class="container">
    <div class="header-logo">
      <img src="https://i.postimg.cc/B695TfCh/alsh%CA%BFar-alhsry.jpg" alt="شعار الأكاديمية">
    </div>
    <h2 style="color: var(--primary-color); font-size: 19px; text-align:center;">تسجيل الدخول للنظام</h2>
    <input type="password" id="sysPassword" placeholder="أدخل كلمة المرور..." style="text-align: center; margin-bottom: 12px;">
    <button class="action-btn" id="loginBtn" onclick="verifyLogin()">دخول 🔓</button>
    <p id="loginMsg" style="color:red; font-weight:bold; margin-top:10px; text-align:center; font-size:14px;"></p>
  </div>

  <!-- ================= النظام الرئيسي ================= -->
  <div id="mainApp" class="container" style="display: none;">
    
    <div class="header-logo">
      <img src="https://i.postimg.cc/B695TfCh/alsh%CA%BFar-alhsry.jpg" alt="شعار الأكاديمية">
    </div>
    
    <h1>أكاديمية الحصري لقراء الجيل الذهبي</h1>
    
    <div class="tabs">
      <button id="tabSearch" class="tab-btn active" onclick="switchTab('search')">البحث والمتابعة</button>
      <button id="tabStats" class="tab-btn" onclick="switchTab('stats')">الإحصائيات</button>
    </div>

    <!-- 1. قسم البحث والمتابعة بالبطاقات -->
    <div id="searchSection" class="section active">
      
      <!-- مزامنة سريعة للجداول -->
      <div class="update-box">
        <button id="updateDbBtn" class="sync-btn" onclick="triggerUpdate()">
          <span id="btnText">🔄 مزامنة الجداول من جوجل</span>
        </button>
        <p id="updateStatus" style="margin: 4px 0 0 0; font-size: 12px; font-weight:bold;"></p>
      </div>

      <div class="form-group">
        <label>نوع البحث:</label>
        <select id="searchType" onchange="toggleSearchInputs()">
          <option value="teacher">بحث باسم المعلمة</option>
          <option value="day">بحث باليوم</option>
        </select>
      </div>
      
      <div id="teacherInput" class="form-group">
        <label>اسم المعلمة:</label>
        <select id="searchTeacherName" class="teacherDropdown"><option value="">جاري التحميل...</option></select>
      </div>

      <div id="dayInput" class="form-group" style="display: none;">
        <label>اليوم:</label>
        <select id="searchDay">
          <option value="السبت">السبت</option><option value="الأحد">الأحد</option><option value="الإثنين">الإثنين</option>
          <option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option><option value="الخميس">الخميس</option><option value="الجمعة">الجمعة</option>
        </select>
      </div>

      <button class="action-btn" onclick="executeSearch()" id="searchBtn">🔍 استخراج الجدول</button>
      
      <div id="searchMessage" style="text-align:center; margin-top:10px; font-weight:bold; font-size:14px;"></div>

      <!-- نتائج البطاقات مع زر إعادة الضبط والفلتر -->
      <div id="resultsContainer" style="margin-top: 14px; display: none;">
        <button class="reset-btn" onclick="resetCardsView()">إعادة الضبط</button>
        
        <input type="text" id="fastFilter" placeholder="تصفية سريعة بالاسم أو الوقت..." onkeyup="filterCards()">
        
        <div id="cardsList"></div>
      </div>

    </div>

    <!-- 2. قسم الإحصائيات -->
    <div id="statsSection" class="section">
      <h3 style="text-align:center; color: var(--primary-color); font-size: 17px; margin-top: 4px;">لوحة معلومات الأكاديمية</h3>
      <button class="action-btn" id="statsBtn" onclick="loadStats()">📊 تحديث الإحصائيات</button>
      <p id="statsMsg" style="text-align:center; font-weight:bold; font-size:13px;"></p>
      
      <div class="stats-container" id="statsDisplay" style="display:none;">
        <div class="stat-card">
          <h3 id="statTeachers">0</h3>
          <p>إجمالي المعلمات</p>
        </div>
        <div class="stat-card">
          <h3 id="statStudents">0</h3>
          <p>إجمالي الطالبات</p>
        </div>
        <div class="stat-card">
          <h3 id="statAttendance">0</h3>
          <p>سجلات الحضور</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzQDz2GXFeqjQqbi78yfb1s6uAKi_QzrxgQ8E4OufZglmsHn9lIhiibim_5JAqXYBmd/exec";

    async function apiCall(action, data = {}) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, data: data })
      });
      const result = await response.json();
      if (result.error) throw new Error(result.error);
      return result;
    }

    async function verifyLogin() {
      const pwd = document.getElementById('sysPassword').value;
      const btn = document.getElementById('loginBtn');
      const msg = document.getElementById('loginMsg');
      
      if(!pwd) { msg.innerText = 'الرجاء إدخال كلمة المرور'; return; }
      
      btn.disabled = true; msg.style.color = '#333'; msg.innerText = '⏳ جاري التحقق...';
      
      try {
        await apiCall('verifyPassword', { password: pwd });
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        loadTeachersData();
      } catch(err) {
        msg.style.color = 'red'; msg.innerText = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('sysPassword').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') verifyLogin();
    });

    function switchTab(tab) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      if(tab === 'search') {
        document.getElementById('searchSection').classList.add('active');
        document.getElementById('tabSearch').classList.add('active');
      } else {
        document.getElementById('statsSection').classList.add('active');
        document.getElementById('tabStats').classList.add('active');
        loadStats();
      }
    }

    function toggleSearchInputs() {
      var type = document.getElementById('searchType').value;
      document.getElementById('teacherInput').style.display = (type === 'teacher') ? 'block' : 'none';
      document.getElementById('dayInput').style.display = (type === 'day') ? 'block' : 'none';
    }

    async function loadTeachersData(forceRefresh = false) {
      try {
        let cachedTeachers = localStorage.getItem('cachedTeachers');
        if (cachedTeachers && !forceRefresh) {
          populateDropdowns(JSON.parse(cachedTeachers));
          return;
        }

        const data = await apiCall('getInitData');
        localStorage.setItem('cachedTeachers', JSON.stringify(data.teachers));
        populateDropdowns(data.teachers);
      } catch (e) { console.error("خطأ: ", e); }
    }

    function populateDropdowns(teachersList) {
      const dropdowns = document.getElementsByClassName('teacherDropdown');
      for (let select of dropdowns) {
        select.innerHTML = '<option value="">-- اختر المعلمة --</option>';
        teachersList.forEach(teacher => {
          let option = document.createElement('option');
          option.value = teacher; option.text = teacher;
          select.appendChild(option);
        });
      }
    }

    // --- توليد البطاقات التفاعلية مع أزرار المتابعة السريعة ---
    async function executeSearch() {
      const btn = document.getElementById('searchBtn');
      const msg = document.getElementById('searchMessage');
      const type = document.getElementById('searchType').value;
      const resContainer = document.getElementById('resultsContainer');
      const cardsList = document.getElementById('cardsList');
      
      let params = { type: type };
      if (type === 'teacher') params.teacher = document.getElementById('searchTeacherName').value;
      if (type === 'day') params.day = document.getElementById('searchDay').value;

      btn.disabled = true; msg.style.color = '#333'; msg.innerText = '⏳ جاري استخراج الحصص...';
      resContainer.style.display = 'none';
      cardsList.innerHTML = '';
      document.getElementById('fastFilter').value = '';

      try {
        const results = await apiCall('searchSchedule', params);
        
        if (!results || results.length === 0) {
          msg.style.color = '#c0392b'; msg.innerText = 'لا توجد حصص مسجلة.';
        } else {
          msg.innerText = 'تم العثور على ' + results.length + ' حصة:';
          msg.style.color = '#198754';
          
          results.forEach((row, idx) => {
            const card = document.createElement('div');
            card.className = 'schedule-card';
            card.id = `card_${idx}`;
            
            // ضبط البيانات لضمان تمريرها بأمان
            const cardTeacher = row.teacher.startsWith('أ/') ? row.teacher : 'أ./ ' + row.teacher;
            
            card.innerHTML = `
              <div class="card-teacher">${cardTeacher}</div>
              <div class="card-student">
                <span style="font-size: 18px;">🎓</span> ${row.student}
              </div>
              <div class="card-meta">${row.day} - ${row.time}</div>
              
              <div class="attendance-actions" id="actions_${idx}">
                <button class="btn-attend btn-present" onclick="quickAttend('${escapeStr(row.teacher)}', '${escapeStr(row.student)}', '${row.day}', '${row.time}', 'حضور', ${idx})">حضرت</button>
                <button class="btn-attend btn-late" onclick="quickAttend('${escapeStr(row.teacher)}', '${escapeStr(row.student)}', '${row.day}', '${row.time}', 'تأخير', ${idx})">تأخرت</button>
                <button class="btn-attend btn-absent" onclick="quickAttend('${escapeStr(row.teacher)}', '${escapeStr(row.student)}', '${row.day}', '${row.time}', 'غياب بدون عذر', ${idx})">تغيبت</button>
              </div>
              <div class="card-status-label" id="statusLabel_${idx}"></div>
            `;
            cardsList.appendChild(card);
          });
          
          resContainer.style.display = 'block';
        }
      } catch (err) {
        msg.style.color = '#c0392b'; msg.innerText = '❌ خطأ: ' + err.message;
      } finally { btn.disabled = false; }
    }

    function escapeStr(str) {
      return (str || '').replace(/'/g, "\\'");
    }

    // --- تسجيل الحضور السريع بضغطة زر ---
    async function quickAttend(teacher, student, day, time, status, index) {
      const actionsDiv = document.getElementById(`actions_${index}`);
      const statusLabel = document.getElementById(`statusLabel_${index}`);
      const card = document.getElementById(`card_${index}`);
      
      actionsDiv.style.opacity = '0.4';
      actionsDiv.style.pointerEvents = 'none';
      statusLabel.style.display = 'block';
      statusLabel.style.color = '#555';
      statusLabel.innerText = '⏳ جاري الحفظ...';

      try {
        const record = { teacher, student, day, time, status, notes: '' };
        await apiCall('saveAttendance', record);
        
        statusLabel.style.display = 'block';
        if (status === 'حضور') {
          statusLabel.style.color = '#198754';
          statusLabel.innerText = '✔ تم تسجيل: حضرت';
          card.style.borderColor = '#198754';
        } else if (status === 'تأخير') {
          statusLabel.style.color = '#e5a100';
          statusLabel.innerText = '✔ تم تسجيل: تأخرت';
          card.style.borderColor = '#e5a100';
        } else {
          statusLabel.style.color = '#dc3545';
          statusLabel.innerText = '✔ تم تسجيل: تغيبت';
          card.style.borderColor = '#dc3545';
        }
      } catch (err) {
        statusLabel.style.color = '#dc3545';
        statusLabel.innerText = '❌ فشل الحفظ: ' + err.message;
        actionsDiv.style.opacity = '1';
        actionsDiv.style.pointerEvents = 'auto';
      }
    }

    // --- وظيفة زر إعادة الضبط ---
    function resetCardsView() {
      document.getElementById('fastFilter').value = '';
      const cards = document.querySelectorAll('.schedule-card');
      cards.forEach(c => {
        c.style.display = '';
        c.style.borderColor = '#e2e8f0';
        const actions = c.querySelector('.attendance-actions');
        if (actions) {
          actions.style.opacity = '1';
          actions.style.pointerEvents = 'auto';
        }
        const statusLabel = c.querySelector('.card-status-label');
        if (statusLabel) {
          statusLabel.style.display = 'none';
          statusLabel.innerText = '';
        }
      });
    }

    // --- فلترة البطاقات الفورية ---
    function filterCards() {
      const term = document.getElementById('fastFilter').value.trim().toLowerCase();
      const cards = document.querySelectorAll('.schedule-card');
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(term) ? '' : 'none';
      });
    }

    // --- المزامنة وتحديث النظام ---
    async function triggerUpdate() {
      const btn = document.getElementById('updateDbBtn');
      const statusText = document.getElementById('updateStatus');
      btn.disabled = true; statusText.style.color = '#333'; statusText.innerText = '⏳ جاري المزامنة من الشيت...';

      try {
        const res = await apiCall('updateMasterDB');
        localStorage.removeItem('cachedTeachers');
        statusText.style.color = '#198754'; statusText.innerText = res.message; 
        await loadTeachersData(true);
      } catch (err) {
        statusText.style.color = '#dc3545'; statusText.innerText = '❌ خطأ: ' + err.message;
      } finally {
        btn.disabled = false;
        setTimeout(() => { statusText.innerText = ''; }, 5000);
      }
    }

    // --- جلب الإحصائيات ---
    async function loadStats() {
      const btn = document.getElementById('statsBtn');
      const msg = document.getElementById('statsMsg');
      btn.disabled = true; msg.style.color = '#333'; msg.innerText = '⏳ جاري القراءة...';
      
      try {
        const stats = await apiCall('getStatistics');
        document.getElementById('statTeachers').innerText = stats.teachers;
        document.getElementById('statStudents').innerText = stats.students;
        document.getElementById('statAttendance').innerText = stats.attendance;
        document.getElementById('statsDisplay').style.display = 'flex';
        msg.innerText = '';
      } catch (err) {
        msg.style.color = '#dc3545'; msg.innerText = '❌ خطأ: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
